databases:
  - name: royan-db
    plan: free

services:
  - type: web
    name: royan-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: royan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PIN
        value: "4321" # CHANGE THIS in the Render dashboard before going live
      - key: OTP_DEV_MODE
        value: "true" # switch to false once a real SMS provider is added
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: https://REPLACE-WITH-YOUR-VERCEL-URL.vercel.app

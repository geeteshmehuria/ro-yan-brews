services:
  - type: web
    name: royan-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # set in dashboard — external Neon Postgres (Render free tier allows only one DB and it's taken)
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: "geeteshmaihuria@gmail.com" # owner account — this email logs in to the admin dashboard
      - key: OTP_DEV_MODE
        value: "true" # switch to false once real SMTP email is configured (SMTP_USER/SMTP_PASS)
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: https://REPLACE-WITH-YOUR-VERCEL-URL.vercel.app

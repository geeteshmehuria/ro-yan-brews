services:
  - type: web
    name: royan-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: WebSockets and order numbering live in this process's memory.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5" # requirements.txt pins are tested on Python 3.13
      - key: DATABASE_URL
        sync: false # set in dashboard — external Neon Postgres (Render free tier allows only one DB and it's taken)
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false # owner account (set in Render dashboard) — this email logs in to the admin dashboard
      - key: OTP_DEV_MODE
        value: "false" # real emailed codes only — REQUIRES SMTP_USER/SMTP_PASS set in the dashboard
      # Email goes through Brevo's SMTP relay on port 2525: Render's free tier blocks 25/465/587.
      # SMTP_USER / SMTP_PASS are secrets — set them in the Render dashboard, not here:
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_FROM_NAME
        value: Ro-Yan Brews
      - key: MAIL_FROM
        sync: false # visible sender; set in Render dashboard (must be verified in Brevo)
      - key: SMTP_USER
        sync: false # set in dashboard (Brevo SMTP login, ends with @smtp-brevo.com)
      - key: SMTP_PASS
        sync: false # set in dashboard (Brevo SMTP key, starts with xsmtpsib-)
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: https://ro-yan-brews.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false # Google sign-in is OFF unless this is set (the endpoint refuses without it)

services:
  - type: web
    name: royan-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: WebSockets and order numbering live in this process's memory.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5" # requirements.txt pins are tested on Python 3.13
      - key: DATABASE_URL
        sync: false # set in dashboard — external Neon Postgres (Render free tier allows only one DB and it's taken)
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: "geeteshmaihuria@gmail.com" # owner account — this email logs in to the admin dashboard
      - key: OTP_DEV_MODE
        value: "false" # real emailed codes only — REQUIRES SMTP_USER/SMTP_PASS set in the dashboard
      # SMTP_USER / SMTP_PASS are secrets — set them in the Render dashboard, not here:
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_FROM_NAME
        value: Ro-Yan Brews
      - key: SMTP_USER
        sync: false # set in dashboard (your Gmail address)
      - key: SMTP_PASS
        sync: false # set in dashboard (Google App Password, 16 chars)
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: https://REPLACE-WITH-YOUR-VERCEL-URL.vercel.app
